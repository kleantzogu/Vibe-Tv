# Builds a debug APK of the Android app (phone + Android TV) on every push to the android branch,
# and keeps it as a download on the run's page. Nothing is published: no release, no tag.
# See ANDROID-PLAN.md.
name: Android

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # nothing here starts Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # what Capacitor 8 builds with
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run build:android-web
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
