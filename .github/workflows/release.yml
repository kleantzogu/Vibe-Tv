# Builds the Windows and Linux installers for a release, checks that each starts (and can recover
# from a broken start), and only then adds them to the release, together with the files installed
# copies read to update themselves (latest.yml, latest-linux.yml). The macOS installer is built,
# checked and signed on a Mac with `npm run release`, which pushes the version tag that starts this.
#
# Run it by hand (Actions ▸ Release ▸ Run workflow) to build an existing tag; leave "publish" off to
# only build and download the installers from the run's artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v1.1.0
        required: true
      ref:
        description: Commit or branch to build instead of the tag (only for fixes outside the app)
        required: false
        default: ''
      publish:
        description: Add the installers to that GitHub release
        type: boolean
        default: false
      only:
        description: Build for
        type: choice
        options: [windows and linux, windows, linux]
        default: windows and linux

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only == 'windows' && '["windows-latest"]' || inputs.only == 'linux' && '["ubuntu-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build
        run: npx electron-builder --publish never

      # The packaged app must start, and must recover from a simulated broken start, before anyone
      # gets it (scripts/launch-check.js). Linux has no screen here, so it runs in a virtual one.
      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        run: node scripts/launch-check.js "dist/win-unpacked/Vibe TV.exe"
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/launch-check.js dist/linux-unpacked/vibe-tv

      - name: Make sure the release exists
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "Vibe TV ${TAG#v}" --notes "Vibe TV ${TAG#v}" ||
            gh release view "$TAG" >/dev/null

      - name: Publish
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.exe.blockmap dist/*.AppImage dist/latest*.yml)
          [ ${#files[@]} -gt 0 ] || { echo "Nothing to publish"; exit 1; }
          gh release upload "$TAG" --clobber "${files[@]}"

      - name: Keep the installers with this run
        uses: actions/upload-artifact@v4
        with:
          name: vibe-tv-${{ env.TAG }}-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # The Android app (phone + Android TV): one signed APK, added to the same release as the desktop
  # installers. It never makes a release of its own, and never touches latest*.yml: installed desktop
  # copies read those from the latest release to update themselves.
  # The signing key comes from repository secrets (see README, "Signing the Android app"). Until they
  # are set, this job says so and adds nothing, and the desktop release is not affected.
  android:
    name: Build (Android)
    if: github.event_name == 'push' || inputs.only == 'windows and linux'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # nothing here starts Electron
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Is there an Android app and a key to sign it with?
        id: can
        shell: bash
        run: |
          if [ ! -d android ]; then echo "This version has no Android app."; echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No Android signing key (secret ANDROID_KEYSTORE_BASE64): the APK is not built."; echo "build=false" >> "$GITHUB_OUTPUT"
          else echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.can.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.can.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.can.outputs.build == 'true'

      - name: Build and sign
        if: steps.can.outputs.build == 'true'
        shell: bash
        env:
          VIBE_TV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIBE_TV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIBE_TV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm test
          npm run build:android-web
          npx cap sync android
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export VIBE_TV_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew assembleRelease --console=plain)
          rm -f "$RUNNER_TEMP/release.jks"
          # A release nobody can install is worse than none: the APK must carry a signature.
          "$ANDROID_HOME"/build-tools/*/apksigner verify android/app/build/outputs/apk/release/Vibe-TV-*-android.apk | tail -1

      - name: Make sure the release exists
        if: steps.can.outputs.build == 'true' && env.PUBLISH == 'true'
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "Vibe TV ${TAG#v}" --notes "Vibe TV ${TAG#v}" ||
            gh release view "$TAG" >/dev/null

      - name: Publish
        if: steps.can.outputs.build == 'true' && env.PUBLISH == 'true'
        shell: bash
        run: gh release upload "$TAG" --clobber android/app/build/outputs/apk/release/Vibe-TV-*-android.apk

      - name: Keep the APK with this run
        if: steps.can.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vibe-tv-${{ env.TAG }}-Android
          path: android/app/build/outputs/apk/release/Vibe-TV-*-android.apk
          if-no-files-found: error
          retention-days: 14
