# Every merge to main that changes the app is a release: installed copies update themselves to it.
#
#  1. `version` picks the number: one more than the newest release (scripts/next-version.js), or
#     "version" in package.json when a pull request raised it (1.3.0, 2.0.0).
#  2. The build jobs make the macOS, Windows and Linux installers and the Android APK with that number.
#     Each desktop installer must start, and must recover from a simulated broken start, before anyone
#     gets it (scripts/launch-check.js).
#  3. `publish` adds them all to a new release with the files installed copies read to update
#     (latest-mac.yml, latest.yml, latest-linux.yml). All of them or nothing: a release without one
#     system's update file would break updates on that system until the next one.
#
# The build jobs run `npm ci`, and with it the install scripts of every dependency, so they only get a
# read-only token and keep their results as run artifacts. `publish`, which never checks out or runs
# the project's code, is the only job allowed to write.
#
# Run it by hand (Actions ▸ Release ▸ Run workflow) to release main without a merge, for example after
# a change that skipped the release below; leave "publish" off to only build and download the
# installers from the run's artifacts (works on any branch).
name: Release

on:
  push:
    branches: [main]
    # Changes that don't touch the app don't make a release of their own: they go out with the next.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/**'
      - 'test/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (only from main)
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, so each takes the number after the one before.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tags say which version came last
          persist-credentials: false
      - id: next
        run: node scripts/next-version.js | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set the version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # A Mac only installs an update signed with the same Developer ID as the app it has, so a release
      # needs the certificate (see README, "Signing the macOS app"). A build-only run can do without.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::No Developer ID certificate (secret MAC_CERTS_P12_BASE64): Macs would refuse the update, so nothing is released."
              exit 1
            fi
            echo "::warning::No Developer ID certificate: this macOS build is not signed."
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --publish never
      - name: Build
        if: runner.os != 'macOS'
        run: npx electron-builder --publish never

      - name: Launch check (macOS)
        if: runner.os == 'macOS'
        run: node scripts/launch-check.js "dist/mac-arm64/Vibe TV.app/Contents/MacOS/Vibe TV"
      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        run: node scripts/launch-check.js "dist/win-unpacked/Vibe TV.exe"
      # Linux has no screen here, so it runs in a virtual one.
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/launch-check.js dist/linux-unpacked/vibe-tv

      # Everything `publish` adds to the release comes from here. Each system writes its own update
      # file (latest-mac.yml, latest.yml, latest-linux.yml), so nothing clashes when they are merged.
      - name: Keep the installers with this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibe-tv-${{ env.VERSION }}-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # The Android app (phone + Android TV): one signed APK in the same release as the desktop
  # installers. It has no update check of its own, and never touches latest*.yml.
  # The signing key comes from repository secrets (see README, "Signing the Android app"). Until they
  # are set, this job says so and adds nothing, and the desktop release is not affected.
  android:
    name: Build (Android)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # nothing here starts Electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Is there a key to sign the app with?
        id: can
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No Android signing key (secret ANDROID_KEYSTORE_BASE64): the APK is not built."; echo "build=false" >> "$GITHUB_OUTPUT"
          else echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.can.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.can.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        if: steps.can.outputs.build == 'true'

      # No secrets here: `npm ci` runs the install scripts of every dependency.
      - name: Build the web part
        if: steps.can.outputs.build == 'true'
        shell: bash
        run: |
          npm ci
          npm test
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build:android-web
          npx cap sync android

      - name: Build and sign
        if: steps.can.outputs.build == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VIBE_TV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIBE_TV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIBE_TV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The key file must not outlive the step, even when the build fails.
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export VIBE_TV_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew assembleRelease --console=plain)
          # A release nobody can install is worse than none: the APK must carry a signature.
          "$ANDROID_HOME"/build-tools/*/apksigner verify android/app/build/outputs/apk/release/Vibe-TV-*-android.apk | tail -1

      - name: Keep the APK with this run
        if: steps.can.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibe-tv-${{ env.VERSION }}-Android
          path: android/app/build/outputs/apk/release/Vibe-TV-*-android.apk
          if-no-files-found: error
          retention-days: 14

  # The only job with write access. It runs only when every build passed.
  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build, android]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_REPO: ${{ github.repository }} # gh works without a checkout when it knows the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vibe-tv-*
          merge-multiple: true
          path: out

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for f in latest-mac.yml latest.yml latest-linux.yml; do
            [ -f "out/$f" ] || { echo "::error::$f is missing, so nothing is released."; exit 1; }
          done
          files=(out/*)
          # A draft first: installed copies only see the release once every file is in it.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Vibe TV $VERSION" --generate-notes
          gh release upload "$TAG" --clobber "${files[@]}"
          gh release edit "$TAG" --draft=false
