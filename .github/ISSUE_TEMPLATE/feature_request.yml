name: Feature request
description: Suggest an idea for Vibe TV
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea for how it could look or behave. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead
